<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="dashboard">
    <!-- Greeting -->
    <header class="greeting">
      <h1 id="greetingText">Hello!</h1>
      <p id="dateTime" class="datetime">—</p>
    </header>

    <div class="grid">
      <!-- Focus Timer -->
      <section class="card timer-card" aria-label="Focus timer">
        <h2 class="card-title">Focus Timer</h2>
        <div class="timer-display" id="timerDisplay">25:00</div>
        <div class="timer-controls">
          <button id="startBtn" class="btn btn-primary">Start</button>
          <button id="stopBtn" class="btn">Stop</button>
          <button id="resetBtn" class="btn">Reset</button>
        </div>
      </section>

      <!-- To-Do List -->
      <section class="card todo-card" aria-label="To-do list">
        <h2 class="card-title">To-Do List</h2>
        <form id="todoForm" class="row-form">
          <input type="text" id="todoInput" placeholder="Add a new task…" autocomplete="off" maxlength="120" />
          <button type="submit" class="btn btn-primary">Add</button>
        </form>
        <ul id="todoList" class="todo-list"></ul>
        <p id="todoEmpty" class="empty-hint">No tasks yet. Add one above.</p>
      </section>
    </div>

    <!-- Quick Links -->
    <section class="card links-card" aria-label="Quick links">
      <h2 class="card-title">Quick Links</h2>
      <form id="linkForm" class="row-form link-form">
        <input type="text" id="linkName" placeholder="Name" autocomplete="off" maxlength="40" />
        <input type="text" id="linkUrl" placeholder="https://…" autocomplete="off" />
        <button type="submit" class="btn btn-primary">Add</button>
      </form>
      <div id="linkList" class="link-list"></div>
      <p id="linkEmpty" class="empty-hint">No links yet. Add your favorites above.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
